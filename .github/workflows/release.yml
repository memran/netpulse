name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      title:
        description: Release title
        required: false
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: netpulse-linux-amd64
            binary: netpulse
          - goos: windows
            goarch: amd64
            artifact: netpulse-windows-amd64
            binary: netpulse.exe
          - goos: darwin
            goarch: amd64
            artifact: netpulse-darwin-amd64
            binary: netpulse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact }}/${{ matrix.binary }} .
          cp README.md dist/${{ matrix.artifact }}/README.md
          cp settings.yml dist/${{ matrix.artifact }}/settings.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: netpulse-linux-amd64
          path: release-assets/netpulse-linux-amd64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: netpulse-windows-amd64
          path: release-assets/netpulse-windows-amd64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: netpulse-darwin-amd64
          path: release-assets/netpulse-darwin-amd64

      - name: Create release archive
        run: |
          cd release-assets
          tar -czf netpulse-linux-amd64.tar.gz netpulse-linux-amd64
          tar -czf netpulse-darwin-amd64.tar.gz netpulse-darwin-amd64
          zip -r netpulse-windows-amd64.zip netpulse-windows-amd64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/netpulse-linux-amd64.tar.gz
            release-assets/netpulse-darwin-amd64.tar.gz
            release-assets/netpulse-windows-amd64.zip
